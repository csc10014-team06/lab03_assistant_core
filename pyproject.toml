[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-core"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [
    "monolith",
    "worksheets",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]