[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-core"
version = "0.1.0"
description = "Refactored study-assistant package (Lab 3)"
requires-python = ">=3.11"

[project.scripts]
assistant = "assistant_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"assistant_core" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["monolith"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
