name: CI

on:
  push:
    branches: [ "main", "feat/**", "feature/**", "chore/**", "lab6/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests with pytest
        run: |
          pytest

      - name: Eval gate (Lab 6) — retrieval and llm (stub) must not get worse
        run: |
          python eval/compare_paths.py --min-pass retrieval=16 --min-pass llm=16 --json eval-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval metrics
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
